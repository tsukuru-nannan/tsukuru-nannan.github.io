name: Update Podcast and Publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:

permissions:
  contents: read

concurrency:
  group: podcast-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch all podcast episodes
        id: rss
        run: python scripts/update_podcast.py

      - name: Save updated episode data
        if: steps.rss.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git commit -m "Update podcast episodes"
          git push

      - name: Decide whether to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          RSS_CHANGED: ${{ steps.rss.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$RSS_CHANGED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.publish.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare static website
        if: steps.publish.outputs.publish == 'true'
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' --exclude='tests' --exclude='__pycache__' --exclude='README.md' --exclude='*.zip' ./ _site/
          touch _site/.nojekyll

      - name: Upload website
        if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
